openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Milo room operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room and its creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room and its participants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Room found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}/participants:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room as a participant
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantInput"
      responses:
        "200":
          description: This browser identity already belongs to the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "201":
          description: Participant joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}/messages:
    get:
      operationId: getRoomMessages
      tags: [rooms]
      summary: List room messages in chronological order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chronological messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          description: Invalid room ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendRoomMessage
      tags: [rooms]
      summary: Send a message as a room participant
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Milo-Browser-Identity
          required: true
          description: The sender's private, browser-held room identity. Never include this in public responses.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Participant identity could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}/understanding:
    get:
      operationId: getRoomUnderstanding
      tags: [rooms]
      summary: Get saved understanding of a room's conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved understanding and analysis status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnderstanding"
        "400":
          description: Invalid room ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{id}/understanding/retry:
    post:
      operationId: retryRoomUnderstanding
      tags: [rooms]
      summary: Request a retry for the room's understanding
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Analysis queued or already up to date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnderstanding"
        "400":
          description: Invalid room ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoomInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 240
        creatorName:
          type: string
          minLength: 1
          maxLength: 40
        browserIdentity:
          type: string
          format: uuid
      required:
        - name
        - creatorName
    ParticipantInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        browserIdentity:
          type: string
          format: uuid
      required:
        - name
        - browserIdentity
    Participant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [creator, member]
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - roomId
        - name
        - role
        - joinedAt
    MessageInput:
      type: object
      additionalProperties: false
      required: [participantId, content]
      properties:
        participantId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 2000
    Message:
      type: object
      required: [id, roomId, participantId, senderName, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        senderName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    UnderstandingInsight:
      type: object
      required: [id, kind, value, normalizedValue, scope, participantId, strength, confidence, status, sourceMessageIds, supersedesInsightId]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        value: { type: string }
        normalizedValue:
          type: ["object", "null"]
          additionalProperties: false
          required: [amount, unit, comparison]
          properties:
            amount: { type: ["number", "null"] }
            unit: { type: ["string", "null"] }
            comparison: { type: ["string", "null"] }
        scope: { type: string, enum: [group, participant] }
        participantId: { type: ["string", "null"], format: uuid }
        strength: { type: string, enum: [hard_constraint, strong_preference, preference] }
        confidence: { type: string, enum: [high, medium, low] }
        status: { type: string, enum: [active, superseded, conflicting, uncertain] }
        sourceMessageIds:
          type: array
          items: { type: string, format: uuid }
        supersedesInsightId: { type: ["string", "null"], format: uuid }
    RoomUnderstanding:
      type: object
      required: [insights, analysisStatus, updatedAt]
      properties:
        insights:
          type: array
          items:
            $ref: "#/components/schemas/UnderstandingInsight"
        analysisStatus: { type: string, enum: [idle, pending, processing, failed] }
        updatedAt: { type: ["string", "null"], format: date-time }
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
      required:
        - id
        - name
        - description
        - createdAt
        - participants
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

