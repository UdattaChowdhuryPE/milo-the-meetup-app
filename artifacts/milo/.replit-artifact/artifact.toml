kind = "web"
previewPath = "/"
title = "Milo"
description = "Milo helps friend groups make plans together. Its landing page introduces the product, and its room flow lets a creator start a persistent room, share its link, and see the conversation, understanding, and suggestions spaces that will grow with future features."
version = "1.0.0"
id = "artifacts/milo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19465

[services.development]
run = "pnpm --filter @workspace/milo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/milo", "run", "build" ]
serve = "static"
publicDir = "artifacts/milo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19465"
BASE_PATH = "/"